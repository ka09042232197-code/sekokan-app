<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>施工管理技士 学習アプリ</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<header>
<h1>🏗️ 施工管理技士 学習アプリ</h1>
</header>

<div id="menu">

<button onclick="startRandomQuiz()">
🎲 ランダム出題
</button>

<button onclick="showCategoryMenu()">
📚 分野別学習
</button>

<button onclick="startMockExam()">
📝 模擬試験
</button>

<button onclick="showFavorites()">
⭐ お気に入り
</button>

<button onclick="showWeakQuestions()">
🔥 苦手問題
</button>

</div>

<div id="stats">

<div>
得点：<span id="score">0</span>
</div>

<div>
正答率：<span id="rate">0%</span>
</div>

</div>

<div id="quizArea"></div>

</div>

<script src="app.js"></script>

</body>
</html>
